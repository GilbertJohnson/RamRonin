[package]
name = "ramronin"
version = "1.1.0"
edition = "2021"
description = "RamRonin - an unhinged stickman ninja that lives on your desktop and bonks memory hogs"
build = "build.rs"
publish = false

[[bin]]
name = "RamRonin"
path = "src/main.rs"

[dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# decodes animated GIF characters
image = { version = "0.25", default-features = false, features = ["gif"] }
# COM wrappers, used only for UI Automation (finding taskbar / tray buttons)
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Security",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
